x-volumes:
  - &project .:/var/www/
  - &project-ro .:/var/www/:ro
  - &ssh ~/.ssh/:/home/developer/.ssh/:ro

x-php-common: &php-common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  environment:
    - TZ=${TZ}
  volumes:
    - *project
    - *ssh
    - ./docker/conf/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
  working_dir: /var/www
  user: developer:developer
  restart: on-failure
  depends_on:
    - db
    - redis

services:
  web:
    container_name: ${APP_NAME}-web
    image: nginx:1.27-alpine
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    environment:
      - TZ=${TZ}
    volumes:
      - *project-ro
      - ./docker/conf/nginx:/etc/nginx/conf.d:ro
      - ./docker/conf/ssl:/etc/nginx/ssl:ro
      - ./docker/logs/nginx:/var/log/nginx
    restart: on-failure
    depends_on:
      - php

  php:
    <<: *php-common
    container_name: ${APP_NAME}-php
    networks:
      default:
        aliases:
          - php

  queue:
    <<: *php-common
    container_name: ${APP_NAME}-queue
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=180 --max-jobs=50 --max-time=3600
    depends_on:
      - php
      - redis
      - db

  scheduler:
    <<: *php-common
    container_name: ${APP_NAME}-scheduler
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      - php
      - db
      - redis

  db:
    container_name: ${APP_NAME}-db
    image: mysql:8.4
    ports:
      - ${DB_HOST_PORT:-33066}:3306
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
    volumes:
      - ./docker/data/db:/var/lib/mysql
      - ./docker/conf/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./docker/logs/mysql:/var/log/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: on-failure
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    container_name: ${APP_NAME}-redis
    image: redis:7-alpine
    volumes:
      - ./docker/data/redis:/data
    restart: on-failure

  mailpit:
    container_name: ${APP_NAME}-mailpit
    image: axllent/mailpit:v1.27.1
    ports:
      - ${MAILPIT_UI_PORT:-8025}:8025
    restart: on-failure

networks:
  default:
    name: ${APP_NAME}-network
